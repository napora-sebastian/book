<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Constellation — Spark Doc Lab</title>
<link rel="stylesheet" href="/grimoire-graphs/graph.css" />
<link rel="stylesheet" href="/grimoire-graphs/constellation.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⁂</text></svg>" />
</head>
<body>

<!-- Same inert backdrop as the deck: a grid floor, a slow sweep, scanlines.
     The canvas floats in front of it and never sits inside it. -->
<div class="void" aria-hidden="true">
  <div class="grid3d"></div>
  <div class="horizon"></div>
  <div class="sweep"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
</div>

<div class="frame" aria-hidden="true"></div>

<!-- The canvas, its chrome, its inspector and its dialogs are all built by
     constellation.js and hung in here. Nothing about the graph is written in
     this file, because none of it belongs to this page in particular. -->
<div id="constellation"></div>

<script src="/i18n.js" type="module"></script>
<script src="/grimoire-graphs/graph.js" type="module"></script>
</body>
</html>
